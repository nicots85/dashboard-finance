# ==============================================================================
# CONFIGURACIÓN DE ACTIVOS — dashboard-finance
# ==============================================================================
# Para agregar o quitar activos, editá la lista correspondiente.
# Cada sección define su fuente (yahoo, ccxt, fred) y los símbolos a monitorear.

indices:
  fuente: yahoo
  descripcion: "Índices globales principales"
  activos:
    - "^NDX"     # Nasdaq 100
    - "^GSPC"    # S&P 500
    - "^DJI"     # Dow Jones Industrial Average
    - "^RUT"     # Russell 2000
    - "^GDAXI"   # DAX (Alemania)
    - "^N225"    # Nikkei 225 (Japón)
  nombres:
    "^NDX": "Nasdaq 100"
    "^GSPC": "S&P 500"
    "^DJI": "Dow Jones Industrial"
    "^RUT": "Russell 2000"
    "^GDAXI": "DAX de Alemania"
    "^N225": "Nikkei 225 de Japón"

metales:
  fuente: yahoo
  descripcion: "Futuros de metales preciosos e industriales"
  activos:
    - "GC=F"     # Oro (Gold Futures)
    - "SI=F"     # Plata (Silver Futures)
    - "HG=F"     # Cobre (Copper Futures)
    - "PL=F"     # Platino (Platinum Futures)
  nombres:
    "GC=F": "Oro — futuro"
    "SI=F": "Plata — futuro"
    "HG=F": "Cobre — futuro"
    "PL=F": "Platino — futuro"

equity:
  fuente: yahoo
  descripcion: "ETFs sectoriales de EE.UU. y acciones Mega-Cap"
  activos:
    # Sectores (SPDR ETFs)
    - "XLK"      # Tecnología
    - "XLF"      # Financiero
    - "XLE"      # Energía
    - "XLV"      # Salud
    - "XLY"      # Consumo Discrecional
    - "XLP"      # Consumo Básico
    - "XLI"      # Industrial
    - "XLB"      # Materiales
    - "XLU"      # Servicios Públicos (Utilities)
    - "XLRE"     # Bienes Raíces (Real Estate)
    - "XLC"      # Comunicaciones
    # Mega Caps
    - "AAPL"     # Apple
    - "MSFT"     # Microsoft
    - "NVDA"     # Nvidia
    - "GOOGL"    # Alphabet (Google)
    - "AMZN"     # Amazon
    - "META"     # Meta (Facebook)
    - "TSLA"     # Tesla
  nombres:
    XLK: "Sector tecnología — fondo cotizado"
    XLF: "Sector financiero — fondo cotizado"
    XLE: "Sector energía — fondo cotizado"
    XLV: "Sector salud — fondo cotizado"
    XLY: "Sector consumo discrecional — fondo cotizado"
    XLP: "Sector consumo básico — fondo cotizado"
    XLI: "Sector industrial — fondo cotizado"
    XLB: "Sector materiales — fondo cotizado"
    XLU: "Sector servicios públicos — fondo cotizado"
    XLRE: "Sector inmobiliario — fondo cotizado"
    XLC: "Sector comunicaciones — fondo cotizado"
    AAPL: "Apple"
    MSFT: "Microsoft"
    NVDA: "Nvidia"
    GOOGL: "Alphabet — Google"
    AMZN: "Amazon"
    META: "Meta Platforms"
    TSLA: "Tesla"

smallcaps:
  fuente: yahoo
  descripcion: "ETFs de pequeñas y medianas empresas de EE.UU."
  activos:
    - "IWM"      # iShares Russell 2000 ETF
    - "IJR"      # iShares Core S&P Small-Cap ETF
    - "IWO"      # iShares Russell 2000 Growth ETF
    - "IWN"      # iShares Russell 2000 Value ETF
  nombres:
    IWM: "Pequeñas empresas Russell 2000 — fondo cotizado"
    IJR: "Pequeñas empresas S&P 600 — fondo cotizado"
    IWO: "Pequeñas empresas de crecimiento — fondo cotizado"
    IWN: "Pequeñas empresas de valor — fondo cotizado"

cripto:
  fuente: ccxt
  descripcion: "Criptomonedas principales y tokens de interés"
  activos:
    - "BTC/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
    - "XRP/USDT"
    - "HYPE/USDT"
    - "BNB/USDT"
  nombres:
    "BTC/USDT": "Bitcoin"
    "ETH/USDT": "Ethereum"
    "SOL/USDT": "Solana"
    "XRP/USDT": "XRP de la red XRP Ledger"
    "HYPE/USDT": "Hyperliquid"
    "BNB/USDT": "BNB de la red BNB Chain"

argentina:
  fuente: yahoo
  descripcion: "Acciones argentinas: pares local (BYMA) y ADR (Wall Street)"
  # Lista de pares: [ticker_local, ticker_adr]
  pares:
    - local: "GGAL.BA"
      adr: "GGAL"
      nombre: "Grupo Financiero Galicia"
    - local: "YPFD.BA"
      adr: "YPF"
      nombre: "YPF"
    - local: "PAMP.BA"
      adr: "PAM"
      nombre: "Pampa Energía"
    - local: "BMA.BA"
      adr: "BMA"
      nombre: "Banco Macro"
    - local: "CEPU.BA"
      adr: "CEPU"
      nombre: "Central Puerto"
  # Equivalencia de acciones por ADR (para CCL implícito).
  # YPF: split 10:1 el 2026-08-04; la serie local YPFD.BA viene ajustada
  # en nuestra base, por lo que se usa el ratio actual (10) para TODA la historia.
  equivalencias:
    GGAL: 10
    YPF: 10
    PAM: 25
    BMA: 10
    CEPU: 10
  # Lista plana de activos para el motor de descarga
  activos:
    - "GGAL.BA"
    - "GGAL"
    - "YPFD.BA"
    - "YPF"
    - "PAMP.BA"
    - "PAM"
    - "BMA.BA"
    - "BMA"
    - "CEPU.BA"
    - "CEPU"
  nombres:
    "GGAL.BA": "Grupo Financiero Galicia — acción local"
    GGAL: "Grupo Financiero Galicia — certificado estadounidense"
    "YPFD.BA": "YPF — acción local"
    YPF: "YPF — certificado estadounidense"
    "PAMP.BA": "Pampa Energía — acción local"
    PAM: "Pampa Energía — certificado estadounidense"
    "BMA.BA": "Banco Macro — acción local"
    BMA: "Banco Macro — certificado estadounidense"
    "CEPU.BA": "Central Puerto — acción local"
    CEPU: "Central Puerto — certificado estadounidense"

referencias:
  fuente: fred
  descripcion: "Series macroeconómicas y tasas de la Reserva Federal (FRED)"
  activos:
    - "DGS10"         # Tasa del Tesoro de EE.UU. a 10 años
    - "DGS2"          # Tasa del Tesoro de EE.UU. a 2 años
    - "T10Y2Y"        # Spread 10Y - 2Y (Curva de rendimientos)
    - "DFII10"        # Rendimiento real del Tesoro a 10 años (TIPS)
    - "VIXCLS"        # Índice de Volatilidad CBOE (VIX)
    - "DTWEXBGS"      # Índice del Dólar estadounidense (Nominal Broad U.S. Dollar Index)
    - "BAMLH0A0HYM2"  # Spread High Yield de Bonos Corporativos de EE.UU. (ICE BofA)
  nombres:
    DGS10: "Tasa del Tesoro estadounidense a 10 años"
    DGS2: "Tasa del Tesoro estadounidense a 2 años"
    T10Y2Y: "Curva de tasas — diferencia entre 10 y 2 años"
    DFII10: "Tasa real estadounidense a 10 años"
    VIXCLS: "Volatilidad esperada del S&P 500 — VIX"
    DTWEXBGS: "Índice amplio del dólar estadounidense"
    BAMLH0A0HYM2: "Diferencia de tasas de bonos de mayor riesgo — spread high yield"
