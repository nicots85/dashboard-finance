  reading_notes: "El CCL implícito de cada empresa es el precio local en pesos multiplicado por la cantidad de acciones del certificado y dividido por el precio del ADR, con la equivalencia de la configuración (diez para YPF). En diario usa el cierre de la misma sesión de cada mercado; en intradía usa velas de quince minutos solamente dentro de la ventana común BYMA–NYSE, que hoy es 14:00–20:00 UTC y desde el cambio de hora de Estados Unidos 14:30–20:00 UTC. La mediana es la de las cinco empresas en la misma fecha; el desvío marca a la empresa que se aleja más del umbral configurado. El CCL es un tipo de cambio con tendencia: un z alto indica que subió rápido, no que vaya a revertir. El conteo de subas y la mayor separación de la media usan las cinco acciones locales en pesos. No se usa cointegración local/ADR. Revisá siempre la fecha, la fuente y los avisos de huecos."
