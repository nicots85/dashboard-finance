# Configuración genérica de secciones para la vista tipo piloto.
# Cada sección tiene los mismos campos; "indices" reproduce fielmente el
# antiguo config/indices_pilot.yaml (que este archivo reemplaza).
indices:
  enabled: true
  names:
    "NQ=F": "Nasdaq 100 — futuro de referencia"
    QQQ: "Nasdaq 100 — fondo cotizado de referencia"
    "ES=F": "S&P 500 — futuro de referencia"
    SPY: "S&P 500 — fondo cotizado de referencia"
    "YM=F": "Dow Jones — futuro de referencia"
    DIA: "Dow Jones — fondo cotizado de referencia"
    "RTY=F": "Russell 2000 — futuro de referencia"
  references:
    "^NDX": ["NQ=F", QQQ]
    "^GSPC": ["ES=F", SPY]
    "^DJI": ["YM=F", DIA]
    "^RUT": ["RTY=F", IWM]
    "^GDAXI": []
    "^N225": []
  calendars:
    "^NDX": NASDAQ
    "^GSPC": NYSE
    "^DJI": NYSE
    "^RUT": NYSE
    "^GDAXI": XETR
    "^N225": JPX
    "NQ=F": CME_Equity
    "ES=F": CME_Equity
    "YM=F": CME_Equity
    "RTY=F": CME_Equity
    QQQ: NASDAQ
    SPY: NYSE
    DIA: NYSE
    IWM: NYSE
  default_ranges:
    "1m": {sessions: 2}
    "5m": {sessions: 5}
    "15m": {sessions: 10}
    "1h": {months: 1}
    "4h": {months: 3}
    "1D": {years: 2}
  vwap:
    price: typical  # (máximo + mínimo + cierre) / 3, del MISMO instrumento que el volumen
    bands: [1, 2]
    minimum_volume_coverage: 0.95
  daily_means: [50, 200]
  relative_strength_sessions: 20
  label: "Índices"
  noun: "índices"
  noun_singular: "Índice"
  macro_series: [DGS10, T10Y2Y, VIXCLS]
  benchmark: "^GSPC"
  benchmark_label: "S&P 500"
  benchmark_hover: "S&P"
  cointegration_scales: ["1D", "1h", "4h"]
  diagnostic_fields: [names, references, calendars, default_ranges, vwap, daily_means, relative_strength_sessions, cointegration, cfdfuture_comparison]
  cointegration:
    primary_window: 500
    contrast_window: 1000
    short_spread_window: 250
    long_baseline: full_history
    required_blocks: 5
    stable_blocks: 4
    p_threshold: 0.05
    johansen_diff_lags: 1
    rolling_step: 21
  cfdfuture_comparison:
    status: pending
    label: "Comparación de NQ=F frente al CFD USTEC: pendiente de tu validación con el bróker."
metales:
  enabled: true
  names:
    "GC=F": "Oro — futuro continuo"
    "SI=F": "Plata — futuro continuo"
    "HG=F": "Cobre — futuro continuo"
    "PL=F": "Platino — futuro continuo"
  references:
    "GC=F": []
    "SI=F": []
    "HG=F": []
    "PL=F": []
  calendars:
    "GC=F": CMEGlobex_Gold
    "SI=F": CMEGlobex_Silver
    "HG=F": CMEGlobex_Copper
    "PL=F": CMEGlobex_Platinum
  default_ranges:
    "1m": {sessions: 2}
    "5m": {sessions: 5}
    "15m": {sessions: 10}
    "1h": {months: 1}
    "4h": {months: 3}
    "1D": {years: 2}
  vwap:
    price: typical
    bands: [1, 2]
    minimum_volume_coverage: 0.95
  daily_means: [50, 200]
  relative_strength_sessions: 20
  label: "Metales"
  noun: "metales"
  noun_singular: "Metal"
  macro_series: [DGS10, DFII10, DTWEXBGS]
  benchmark: "DTWEXBGS"
  benchmark_label: "dólar"
  benchmark_hover: "USD"
  cointegration_scales: ["1D"]
  detail_subject: "El metal"
  deduplicate_daily_sessions: true
  compare_all_assets: true
  pair_selector_label: "Par de metales"
  benchmark_notice: "Comparación de rendimientos porcentuales contra el Índice amplio del dólar estadounidense (DTWEXBGS) de FRED, sobre 20 sesiones comunes. No es una conversión monetaria ni cotización en vivo; el corte de la comparación puede preceder al último cierre de los metales."
  asset_timeframes:
    "PL=F": ["1D"]
  vwap_disabled: ["PL=F"]
  vwap_sessions: [complete]
  asset_notices:
    "PL=F": "Platino: solo lectura diaria y medias de cierres. No se muestra VWAP porque la cobertura de volumen intradía es incompleta."
  notices:
    - "Los futuros continuos de Yahoo pueden tener saltos en los cambios de contrato; no se verificó cómo los ajusta."
    - "VWAP de Oro, Plata y Cobre: precio típico y volumen del mismo futuro. Sesión completa provisional: reinicio a las 18:00 de Nueva York, con ajuste por horario de verano. Platino se limita a diario, sin VWAP."
  reading_notes: "Primero mirá si varios metales y escalas coinciden. La fuerza relativa compara rendimientos frente al dólar sobre sesiones comunes; estar lejos de una media no equivale a ser más fuerte. El ratio Oro/Plata compara ambos cierres, y su distancia usa media y desvío de 50 sesiones comunes. La tasa real a 10 años, la tasa nominal y el dólar dan contexto. Las bandas de VWAP describen distancia, no aseguran reversión. Platino solo se muestra en diario, sin VWAP. Cointegración: solo 1D. Revisá fechas, fuente y velas abiertas. La dirección se detecta mejor en subas que en caídas: en caídas históricas conocidas marcó como bajista entre 37% y 56% de las velas; un lateral o alcista débil durante una caída no es necesariamente un error."
  ratios:
    - {y: "GC=F", x: "SI=F", label: "Oro / Plata", window: 50, chart_sessions: 500}
  cointegration:
    primary_window: 500
    contrast_window: 1000
    short_spread_window: 250
    long_baseline: full_history
    required_blocks: 5
    stable_blocks: 4
    p_threshold: 0.05
    johansen_diff_lags: 1
    rolling_step: 21
